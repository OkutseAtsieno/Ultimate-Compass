{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ultimate Compass{% endblock %}</title>
  <meta name="description" content="Ultimate Compass: computer vision, machine learning and dashboard projects by Okutse Atsieno, data scientist and full-stack developer.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FFD700'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%230b1f3a' stroke-width='4'/%3E%3Cpolygon points='32,10 41,32 23,32' fill='%230b1f3a'/%3E%3Cpolygon points='32,54 41,32 23,32' fill='none' stroke='%230b1f3a' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Playfair Display font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      /* overflow: hidden removed — this was blocking all page scrolling */
    }

    /* ==============================
       NAVBAR
    ============================== */

    .navbar-custom {
      background-color: #FFD700; /* bright yellow */
      transition: background-color 0.4s ease;
    }

    .navbar-custom.scrolled {
      background-color: rgba(255, 215, 0, 0.3); /* transparent yellow on scroll */
    }

    .navbar-custom .navbar-brand,
    .navbar-custom .nav-link,
    .navbar-custom .dropdown-item {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-style: italic;
      color: #000 !important;
    }

    .navbar-custom .nav-link:hover,
    .navbar-custom .dropdown-item:hover {
      color: #333 !important;
    }

    .navbar-custom .navbar-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .navbar-custom .nav-link.active {
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    .navbar-nav {
      display: flex;
      gap: 1.5rem; /* spacing between nav items */
    }

    /* ==============================
       PAGE CONTENT WRAPPER
       (pushes content below the fixed navbar)
    ============================== */

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-content {
      padding-top: 80px;
      flex: 1 0 auto;
    }

    /* ==============================
       SITE FOOTER
    ============================== */

    .site-footer {
      background: #0b1f3a;
      color: white;
      padding: 45px 25px 35px;
      flex-shrink: 0;
    }

    .site-footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 25px 40px;
    }

    .footer-about h3 {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .footer-about p {
      color: #d6d6d6;
      margin: 0;
      line-height: 1.6;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-btn {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;            /* comfortable tap target on phones */
      padding: 0 20px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 30px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .footer-btn i {
      font-size: 1.15rem;
      line-height: 1;
    }

    .footer-btn:hover,
    .footer-btn:focus-visible {
      background: #FFD700;
      border-color: #FFD700;
      color: #0b1f3a;
    }

    .footer-email-row {
      flex-basis: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.15);
      color: #d6d6d6;
      font-size: 0.95rem;
    }

    .footer-email-row a {
      color: #FFD700;
      text-decoration: none;
    }

    .footer-email-row a:hover {
      text-decoration: underline;
    }

    .footer-credit {
      flex-basis: 100%;
      margin: 0;
      font-size: .85rem;
      color: #8fa0bb;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.35);
      color: white;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: #FFD700;
      color: #0b1f3a;
      border-color: #FFD700;
    }

    @media (max-width: 600px) {
      .site-footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-links {
        width: 100%;
      }

      .footer-btn {
        flex: 1 1 calc(50% - 6px);   /* two buttons per row */
        justify-content: center;
      }
    }

    {% block extra_style %}{% endblock %}
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'home' %}" aria-label="Ultimate Compass, home">
        <svg class="brand-mark" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
          <circle cx="32" cy="32" r="26" fill="none" stroke="#0b1f3a" stroke-width="5"/>
          <polygon points="32,10 42,32 22,32" fill="#0b1f3a"/>
          <polygon points="32,54 42,32 22,32" fill="none" stroke="#0b1f3a" stroke-width="3.5" stroke-linejoin="round"/>
        </svg>
        <span>ULTIMATE <b>COMPASS</b></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'Aboutme' %}active{% endif %}" href="{% url 'Aboutme' %}">About</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'services' %}active{% endif %}" href="{% url 'services' %}">Services</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'projects' %}active{% endif %}" href="{% url 'projects' %}">Projects</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <div class="page-content">
    {% block content %}
    <h1>Hello World</h1>
    {% endblock %}
  </div>

  {% include "_footer.html" %}

  <!-- Bootstrap JS + Scroll script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.addEventListener("scroll", function () {
      const navbar = document.querySelector(".navbar-custom");
      navbar.classList.toggle("scrolled", window.scrollY > 50);
    });
  </script>

  <script>
    // Copy-email fallback for phones without a mail app
    (function () {
      var btn = document.getElementById("copyEmailBtn");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var text = document.getElementById("footerEmail").textContent.trim();
        function done() { btn.textContent = "Copied!"; setTimeout(function () { btn.textContent = "Copy"; }, 2000); }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(done, fallback);
        } else { fallback(); }
        function fallback() {
          var t = document.createElement("textarea");
          t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
          document.body.appendChild(t); t.select();
          try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "Select & copy"; }
          document.body.removeChild(t);
        }
      });
    })();
  </script>

  {% block extra_scripts %}{% endblock %}

</body>
</html>
