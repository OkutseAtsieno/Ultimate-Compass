{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ultimate Compass{% endblock %}</title>
  <meta name="description" content="Ultimate Compass: computer vision, machine learning and dashboard projects by Okutse Atsieno, data scientist and full-stack developer.">
  <link rel="icon" type="image/png" href="{% static 'icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icon-192.png' %}">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Poppins: the one font for the whole site, the logo and the merchandise -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      /* overflow: hidden removed — this was blocking all page scrolling */
    }

    /* ==============================
       ONE FONT FOR THE WHOLE SITE
       Poppins everywhere, same as the logo and merchandise.
       The !important makes it win over any other font set inside a page's own
       <style> block (home.html still names Playfair Display in a few rules).
       Icons and code blocks are left alone.
    ============================== */

    :root {
      --font-brand: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body,
    body *:not(.bi):not(code):not(pre):not(kbd):not(samp) {
      font-family: var(--font-brand) !important;
    }

    /* ==============================
       NAVBAR
    ============================== */

    .navbar-custom {
      background-color: #FFD700; /* bright yellow */
      transition: background-color 0.4s ease;
    }

    .navbar-custom.scrolled {
      background-color: rgba(255, 215, 0, 0.3); /* transparent yellow on scroll */
    }

    .navbar-custom .navbar-brand,
    .navbar-custom .nav-link,
    .navbar-custom .dropdown-item {
      font-weight: 500;
      font-style: normal;
      color: #0b1f3a !important;   /* brand navy, same as the logo */
    }

    .navbar-custom .nav-link:hover,
    .navbar-custom .dropdown-item:hover {
      color: #1c3d6e !important;
    }

    .navbar-custom .navbar-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .navbar-custom .brand-mark {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      color: #0b1f3a;
    }

    .navbar-custom .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .navbar-custom .brand-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .navbar-custom .brand-slogan {
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      opacity: 0.85;
    }

    @media (max-width: 380px) {
      .navbar-custom .brand-mark { width: 36px; height: 36px; }
      .navbar-custom .brand-name { font-size: 1rem; }
      .navbar-custom .brand-slogan { font-size: 0.58rem; }
    }

    .navbar-custom .nav-link.active {
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    .navbar-nav {
      display: flex;
      gap: 1.5rem; /* spacing between nav items */
    }

    /* ==============================
       PAGE CONTENT WRAPPER
       (pushes content below the fixed navbar)
    ============================== */

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-content {
      padding-top: 80px;
      flex: 1 0 auto;
    }

    /* ==============================
       SITE FOOTER
    ============================== */

    .site-footer {
      background: #0b1f3a;
      color: white;
      padding: 45px 25px 35px;
      flex-shrink: 0;
    }

    .site-footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 25px 40px;
    }

    .footer-about h3 {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .footer-about p {
      color: #d6d6d6;
      margin: 0;
      line-height: 1.6;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-btn {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;            /* comfortable tap target on phones */
      padding: 0 20px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 30px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .footer-btn i {
      font-size: 1.15rem;
      line-height: 1;
    }

    .footer-btn:hover,
    .footer-btn:focus-visible {
      background: #FFD700;
      border-color: #FFD700;
      color: #0b1f3a;
    }

    .footer-email-row {
      flex-basis: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.15);
      color: #d6d6d6;
      font-size: 0.95rem;
    }

    .footer-email-row a {
      color: #FFD700;
      text-decoration: none;
    }

    .footer-email-row a:hover {
      text-decoration: underline;
    }

    .footer-credit {
      flex-basis: 100%;
      margin: 0;
      font-size: .85rem;
      color: #8fa0bb;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.35);
      color: white;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: #FFD700;
      color: #0b1f3a;
      border-color: #FFD700;
    }

    @media (max-width: 600px) {
      .site-footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-links {
        width: 100%;
      }

      .footer-btn {
        flex: 1 1 calc(50% - 6px);   /* two buttons per row */
        justify-content: center;
      }
    }

    {% block extra_style %}{% endblock %}
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'home' %}" aria-label="Ultimate Compass, home">
        <svg class="brand-mark" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <defs>
            <mask id="bmr" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><g fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"><polygon points="100,4 108,94 92,94"/><polygon points="100,196 108,106 92,106"/><polygon points="196,100 124,92 124,108"/><polygon points="4,100 76,92 76,108"/><g transform="rotate(40 100 100)"><polygon points="100,30 112,100 88,100"/><polygon points="100,170 112,100 88,100"/></g></g></mask>
            <mask id="bmp" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><g fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"><g transform="rotate(40 100 100)"><polygon points="100,30 112,100 88,100"/><polygon points="100,170 112,100 88,100"/></g></g><circle cx="100" cy="100" r="13.5" fill="#000"/></mask>
            <mask id="bmn" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><circle cx="100" cy="100" r="13.5" fill="#000"/></mask>
          </defs>
          <circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="9" mask="url(#bmr)"/>
          <g mask="url(#bmp)"><polygon points="100,4 108,94 92,94" fill="currentColor"/><polygon points="100,196 108,106 92,106" fill="currentColor"/><polygon points="196,100 124,92 124,108" fill="currentColor"/><polygon points="4,100 76,92 76,108" fill="currentColor"/></g>
          <g transform="rotate(40 100 100)" mask="url(#bmn)"><polygon points="100,30 112,100 88,100" fill="currentColor"/><polygon points="100,170 112,100 88,100" fill="currentColor"/></g>
          <circle cx="100" cy="100" r="8.5" fill="none" stroke="currentColor" stroke-width="3"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">Ultimate Compass</span>
          <span class="brand-slogan">Turning Data Into Better Decisions</span>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'Aboutme' %}active{% endif %}" href="{% url 'Aboutme' %}">About</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'services' %}active{% endif %}" href="{% url 'services' %}">Services</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'projects' %}active{% endif %}" href="{% url 'projects' %}">Projects</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <div class="page-content">
    {% block content %}
    <h1>Hello World</h1>
    {% endblock %}
  </div>

  {% include "_footer.html" %}

  <!-- Bootstrap JS + Scroll script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.addEventListener("scroll", function () {
      const navbar = document.querySelector(".navbar-custom");
      navbar.classList.toggle("scrolled", window.scrollY > 50);
    });
  </script>

  <script>
    // Copy-email fallback for phones without a mail app
    (function () {
      var btn = document.getElementById("copyEmailBtn");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var text = document.getElementById("footerEmail").textContent.trim();
        function done() { btn.textContent = "Copied!"; setTimeout(function () { btn.textContent = "Copy"; }, 2000); }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(done, fallback);
        } else { fallback(); }
        function fallback() {
          var t = document.createElement("textarea");
          t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
          document.body.appendChild(t); t.select();
          try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "Select & copy"; }
          document.body.removeChild(t);
        }
      });
    })();
  </script>

  {% block extra_scripts %}{% endblock %}

</body>
</html>
